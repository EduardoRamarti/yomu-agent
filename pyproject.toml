[project]
name = "yomu-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mikoushi", email = "eduardo.ramarti@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gitpython>=3.2.0",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.7",
    "langchain-openai>=1.6.7",
    "pathlib>=1.0.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
yomu-agent = "yomu_agent:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
